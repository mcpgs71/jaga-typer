<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadra — przerywnik</title>
<style>
  :root{--bg:#0f1420;--card:#171d2b;--tx:#e6e9f0;--mut:#8a93a6;--acc:#ff8c42;--blue:#4c8cff;--ok:#3ddc84}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
  h1{font-size:20px;margin:8px 0 2px} .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #2a3244;background:#0b0f18;color:var(--tx);font-size:16px}
  .m{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
  .t{font-weight:600} .d{color:var(--mut);font-size:12px;margin-bottom:8px}
  .z{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
  .z button{padding:12px 0;border-radius:8px;border:1px solid #2a3244;background:#0b0f18;color:var(--tx);font-size:16px;font-weight:700}
  .z button.on{background:var(--acc);border-color:var(--acc);color:#111}
  .w{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
  .w input{width:56px;padding:8px;text-align:center;border-radius:8px;border:1px solid #2a3244;background:#0b0f18;color:var(--tx);font-size:16px}
  .send{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#25d366;color:#0b1a10;font-size:17px;font-weight:700}
  .copy{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid #2a3244;border-radius:10px;background:transparent;color:var(--tx);font-size:14px}
  .out{margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--ok);word-break:break-all;min-height:18px}
  .rules{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kadra — przerywnik</h1>
  <div class="sub">Liga Narodów · 4 mecze · bez żetonów · znak 1 pkt, dokładny wynik 3 pkt · typy do pt 25.09, 20:00</div>
  <input type="text" id="nick" placeholder="Twoje imię (jak na typerze)">
  <div id="mecze"></div>
  <button class="send" id="wa">Wyślij na WhatsApp</button>
  <button class="copy" id="cp">Skopiuj zamiast wysyłać</button>
  <div class="out" id="out"></div>
  <div class="rules">1 = gospodarz, X = remis, 2 = gość — jak na typerze. Wynik gospodarz:gość. Kto nie wpisze wyniku, gra tylko znak.</div>
</div>
<script>
const M=[["Polska – Bośnia i Hercegowina","pt 25.09, 20:45 · Warszawa"],
         ["Szwecja – Polska","pn 28.09, 20:45 · Solna"],
         ["Polska – Rumunia","pt 2.10, 20:45 · Warszawa"],
         ["Bośnia i Hercegowina – Polska","pn 5.10, 20:45 · Zenica"]];
const st=M.map(()=>({z:null}));
const box=document.getElementById('mecze');
M.forEach((m,i)=>{
  const d=document.createElement('div');d.className='m';
  d.innerHTML=`<div class="t">${m[0]}</div><div class="d">${m[1]}</div>
   <div class="z">${['1','X','2'].map(z=>`<button data-i="${i}" data-z="${z}">${z}</button>`).join('')}</div>
   <div class="w">wynik: <input inputmode="numeric" maxlength="2" id="h${i}"> : <input inputmode="numeric" maxlength="2" id="a${i}"></div>`;
  box.appendChild(d);
});
box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const i=+b.dataset.i;st[i].z=b.dataset.z;
  box.querySelectorAll(`button[data-i="${i}"]`).forEach(x=>x.classList.toggle('on',x.dataset.z===st[i].z));
  // znak z wyniku: jesli wpisany wynik klóci sie ze znakiem, czyscimy wynik
  const h=document.getElementById('h'+i),a=document.getElementById('a'+i);
  if(h.value!==''&&a.value!==''&&znak(h.value,a.value)!==st[i].z){h.value='';a.value='';}
});
function znak(h,a){h=+h;a=+a;return h>a?'1':(h<a?'2':'X');}
box.addEventListener('input',e=>{const id=e.target.id;if(!id)return;const i=+id.slice(1);
  const h=document.getElementById('h'+i).value,a=document.getElementById('a'+i).value;
  if(h!==''&&a!==''){st[i].z=znak(h,a);
    box.querySelectorAll(`button[data-i="${i}"]`).forEach(x=>x.classList.toggle('on',x.dataset.z===st[i].z));}
});
function linia(){
  const n=document.getElementById('nick').value.trim();
  if(!n){alert('Wpisz imię');return null;}
  const parts=M.map((m,i)=>{const z=st[i].z||'-';const h=document.getElementById('h'+i).value,a=document.getElementById('a'+i).value;
    return z+(h!==''&&a!==''?' '+h+':'+a:'');});
  if(parts.every(p=>p==='-')){alert('Wybierz choć jeden znak');return null;}
  return `Kadra — ${n}: ${parts.join(' / ')}`;
}
document.getElementById('wa').onclick=()=>{const l=linia();if(!l)return;document.getElementById('out').textContent=l;
  window.open('https://wa.me/?text='+encodeURIComponent(l),'_blank');};
document.getElementById('cp').onclick=async()=>{const l=linia();if(!l)return;document.getElementById('out').textContent=l;
  try{await navigator.clipboard.writeText(l);}catch(e){}};
</script>
</body>
</html>
